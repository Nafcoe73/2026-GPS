# Compila o APK na nuvem do GitHub (não precisas de Android Studio nem de nada instalado).
# Separador "Actions" -> "Compilar APK" -> no fim descarrega o artefacto "mapa-offline-apk".
# Se falhar: o resumo do erro aparece no passo "Mostrar o erro", e o registo completo
# fica no artefacto "registo-do-erro".
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Verificar ficheiros
        run: |
          ok=1
          for f in main.py buildozer.spec; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta o ficheiro $f na raiz do repositório (ao lado da pasta .github)."
              ok=0
            fi
          done
          ls -la
          [ "$ok" = 1 ]

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Dependências do sistema (lista oficial do Buildozer para Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev automake autopoint gettext
          pip install --upgrade pip
          pip install buildozer setuptools "cython==0.29.34"

      - name: Cache do SDK/NDK (acelera as compilações seguintes)
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Compilar
        run: |
          set +e
          yes | buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[1]}
          exit $status

      - name: Mostrar o erro
        if: failure()
        run: |
          echo "=============== ÚLTIMAS 120 LINHAS DO REGISTO ==============="
          tail -n 120 build.log 2>/dev/null || echo "(sem build.log: o erro foi num passo anterior)"

      - name: Guardar registo completo
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: registo-do-erro
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: mapa-offline-apk
          path: bin/*.apk
